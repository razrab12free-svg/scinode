name: scinode
description: Open network of scientists worldwide.
publish_to: "none"
version: 0.4.0+4

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ">=3.0.0"
  firebase_auth: ">=5.0.0"
  cloud_firestore: ">=5.0.0"
  google_sign_in: ^7.0.0
  shared_preferences: ^2.2.0
  http: ^1.2.0
  http_parser: ^4.0.0
  url_launcher: ^6.3.0
  path_provider: ^2.1.0
  pdfrx: ^2.0.0
  flutter_map: ^8.3.2
  latlong2: ^0.9.1
  flutter_map_marker_cluster: ^8.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.0
  fake_cloud_firestore: ^4.5.0

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 23
  adaptive_icon_background: "#0B0F2E"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"

flutter:
  uses-material-design: true
